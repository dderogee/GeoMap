<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>GeoMap</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;margin:24px}
    #map-wrap{max-width:1200px}
    /* SVG responsief */
    #map-wrap svg{width:100%;height:auto;display:block}

    /* standaard landen look (Simplemaps gebruikt meestal paths) */
    #map-wrap [id]{ transition: fill .15s ease, opacity .15s ease; cursor:pointer; }

    /* hover */
    #map-wrap [id]:hover{ opacity:.75; }

    /* “visited” landen */
    .visited{ fill:#7fc97f !important; }

    /* optioneel: voorkom dat oceaan/achtergrond klikbaar wordt (als die een id heeft) */
    /* #map-wrap #ocean, #map-wrap #background { pointer-events:none; } */
  </style>
</head>

<body>
  <h1>GeoMap</h1>
  <p>Klik landen aan om ze als “bezocht” te markeren.</p>

  <div id="map-wrap">
    <!-- Laad de SVG inline in de pagina -->
    <object id="svgObj" type="image/svg+xml" data="world.svg"></object>
  </div>

<script>
  const obj = document.getElementById("svgObj");

  obj.addEventListener("load", () => {
    const svgDoc = obj.contentDocument;
    if (!svgDoc) return;

    const svg = svgDoc.querySelector("svg");
    if (!svg) return;

    // Inject CSS in de SVG
    const style = svgDoc.createElementNS("http://www.w3.org/2000/svg", "style");
    style.textContent = `
      path { cursor: pointer; transition: fill .15s ease, opacity .15s ease; }
      path:hover { opacity: .75; }
      .visited { fill: #1e6bff !important; }
    `;
    svg.insertBefore(style, svg.firstChild);

    // restore
    let saved = [];
    try { saved = JSON.parse(localStorage.getItem("visitedCountries") || "[]"); } catch(e) {}
    const visited = new Set(saved);

    // geef elk pad een key en zet initieel visited
    const paths = [...svg.querySelectorAll("path")];

    function keyFor(el, idx) {
      const id = (el.id || "").trim();
      if (id) return `id:${id}`;

      const cls = (el.getAttribute("class") || "").trim();
      if (cls) return `class:${cls}`;

      return `idx:${idx}`; // fallback (komt zelden voor)
    }

    function applyVisited() {
      paths.forEach((p, i) => {
        const k = keyFor(p, i);
        p.classList.toggle("visited", visited.has(k));
      });
    }

    function persist() {
      localStorage.setItem("visitedCountries", JSON.stringify([...visited]));
    }

    applyVisited();

    // click: toggle op key
    paths.forEach((p, i) => {
      p.addEventListener("click", (e) => {
        e.preventDefault();
        const k = keyFor(p, i);
        if (visited.has(k)) visited.delete(k);
        else visited.add(k);

        applyVisited();
        persist();
      });
    });
  });
</script>
</body>
</html>
