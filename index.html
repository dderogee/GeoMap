<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>GeoMap</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;margin:24px}
    #map-wrap{max-width:1200px}
    /* SVG responsief */
    #map-wrap svg{width:100%;height:auto;display:block}

    /* standaard landen look (Simplemaps gebruikt meestal paths) */
    #map-wrap [id]{ transition: fill .15s ease, opacity .15s ease; cursor:pointer; }

    /* hover */
    #map-wrap [id]:hover{ opacity:.75; }

    /* “visited” landen */
    .visited{ fill:#7fc97f !important; }

    /* optioneel: voorkom dat oceaan/achtergrond klikbaar wordt (als die een id heeft) */
    /* #map-wrap #ocean, #map-wrap #background { pointer-events:none; } */
  </style>
</head>

<body>
  <h1>GeoMap</h1>
  <p>Klik landen aan om ze als “bezocht” te markeren.</p>

  <div id="map-wrap">
    <!-- Laad de SVG inline in de pagina -->
    <object id="svgObj" type="image/svg+xml" data="world.svg"></object>
  </div>

<script>
  // Zet hier je 33 landen (exact zoals ze in world.svg als class staan)
  // Voorbeelden:
  const visited = new Set([
    "Netherlands",
    "France",
    "United States"
  ]);

  const obj = document.getElementById("svgObj");

  obj.addEventListener("load", () => {
    const svgDoc = obj.contentDocument;
    if (!svgDoc) return;

    const svg = svgDoc.querySelector("svg");
    if (!svg) return;

    // CSS in de SVG zelf injecteren (nodig voor <object>)
    const style = svgDoc.createElementNS("http://www.w3.org/2000/svg", "style");
    style.textContent = `
      path[class] { cursor: pointer; transition: fill .15s ease, opacity .15s ease; }
      path[class]:hover { opacity: .75; }
      .visited { fill: #2b6cff !important; }
    `;
    svg.insertBefore(style, svg.firstChild);

    // Restore uit localStorage
    const saved = JSON.parse(localStorage.getItem("visitedCountries") || "[]");
    saved.forEach(name => visited.add(name));

    // Helper: markeer alle paths van een land (zelfde class)
    const setVisited = (countryName, on) => {
      const paths = svg.querySelectorAll('path[class]');
      paths.forEach(p => {
        if (p.getAttribute("class") === countryName) {
          if (on) p.classList.add("visited");
          else p.classList.remove("visited");
        }
      });
    };

    // Initieel toepassen
    visited.forEach(name => setVisited(name, true));

    // Klik: toggle per land (per class-naam)
    svg.querySelectorAll("path[class]").forEach(p => {
      const countryName = p.getAttribute("class");
      if (!countryName) return;

      p.addEventListener("click", (e) => {
        e.preventDefault();

        const isOn = visited.has(countryName);
        if (isOn) visited.delete(countryName);
        else visited.add(countryName);

        setVisited(countryName, !isOn);

        localStorage.setItem("visitedCountries", JSON.stringify([...visited].sort()));
      });
    });
  });
</script>
</body>
</html>
